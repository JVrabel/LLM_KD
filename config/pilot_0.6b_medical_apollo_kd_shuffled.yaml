# Pure distillation on Apollo for the 0.6B student, same budget and schedule as
# pilot_0.6b_medical_apollo_kd, but sequences are drawn in a seeded random
# order across the Apollo text pack and the Apollo question-answer pack
# instead of pack order. Rerun of the quality arm after the no-shuffle finding.
seed: 42
model_size: 0.6b
data:
  - dir: /projects/u6wc/savants/data/packed/medical_apollo
    logit_dir: /projects/u6wc/savants/data/logits/medical_apollo
    shards: 30
  - dir: /projects/u6wc/savants/data/packed/medical_apollo_qa
    logit_dir: /projects/u6wc/savants/data/logits/medical_apollo_qa
output_dir: /projects/u6wc/savants/runs/pilot_0.6b_medical_apollo_kd_shuffled
training:
  shuffle: true
  steps: 30517
  warmup_steps: 300
  decay_start_step: 27465
  learning_rate: 6.0e-4
  lr_floor: 0.1
  batch_sequences: 8
  kd_ratio: 1.0
  temperature: 1.0
  logit_chunk: 1024
  log_every: 20
  save_every: 1000
