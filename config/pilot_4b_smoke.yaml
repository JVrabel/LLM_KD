# Two steps to check whether the 4B student fits on one GPU. This is not a
# training plan; run it only after the 1.7B comparison justifies the size.
seed: 42
model_size: 4b
data_dir: /projects/u6wc/savants/data/packed/python
logit_dir: null
output_dir: /projects/u6wc/savants/runs/pilot_4b_smoke
training:
  steps: 2
  warmup_steps: 1
  decay_start_step: 2
  learning_rate: 6.0e-4
  lr_floor: 0.1
  batch_sequences: 1
  grad_accumulation_steps: 1
  kd_ratio: 0.0
  temperature: 1.0
  logit_chunk: 1024
  log_every: 1
  save_every: 2
