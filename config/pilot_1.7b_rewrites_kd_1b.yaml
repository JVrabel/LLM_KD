# Denser-knowledge test (20 Nov 2026, Jakub's last-week budget): the distilled
# 1.7b student continued from its 3B-token checkpoint for 1.0B tokens of
# teacher-written rewrites of Apollo documents (textbook passage, exam
# questions, study notes; scripts/generate_rewrites.py), scored with the usual
# teacher logits. Controls: pilot_1.7b_apollo_e4_kd (1B more Apollo tokens,
# no exam gain) and the 3B checkpoint itself. Same schedule as the other
# continuations: 500-step re-warmup, constant to 70%, cosine to 10%.
seed: 42
model_size: 1.7b
resume: /projects/u6wc/savants/runs/pilot_1.7b_medical_apollo_kd_shuffled_3b/step_0091551.pt
data:
  - dir: /projects/u6wc/savants/data/packed/rewrites
    logit_dir: /projects/u6wc/savants/data/logits/rewrites
    shards: 30
  - dir: /projects/u6wc/savants/data/packed/medical_apollo_qa_clean
    logit_dir: /projects/u6wc/savants/data/logits/medical_apollo_qa_clean
output_dir: /projects/u6wc/savants/runs/pilot_1.7b_rewrites_kd_1b
training:
  shuffle: true
  reset_cursor: true
  steps: 122068
  warmup_steps: 300
  rewarmup_from_step: 91551
  rewarmup_steps: 500
  decay_start_step: 112913
  learning_rate: 6.0e-4
  lr_floor: 0.1
  batch_sequences: 8
  grad_accumulation_steps: 1
  kd_ratio: 1.0
  temperature: 1.0
  logit_chunk: 1024
  log_every: 20
  save_every: 5000
