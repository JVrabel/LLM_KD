# Next-token twin of pilot_1.7b_medical_apollo_kd_shuffled_3b (9 Nov 2026): the
# shuffled next-token 1.7B student continued from its final 1B-token checkpoint
# to 3.0B tokens on the same pool, same schedule and re-warmup, so the
# next-token and distilled scaling laws cover the same token range. Jakub's
# ask: show robustly that next-token stays behind distillation. Four chained
# 24 h jobs with RESUME_LATEST=1 (61k steps at 14.7 steps/min, resumes lose up
# to 5000 steps each).
seed: 42
