data:
  - dir: /projects/u6wc/savants/data/packed/medical_apollo
    logit_dir: /projects/u6wc/savants/data/logits/medical_apollo
    shards: 30
  - dir: /projects/u6wc/savants/data/packed/medical_apollo_qa_clean
    logit_dir: /projects/u6wc/savants/data/logits/medical_apollo_qa_clean
output_dir: /projects/u6wc/savants/runs/pilot_1.7b_medical_apollo_ntp_shuffled_3b
training:
  shuffle: true
  steps: 91551
  warmup_steps: 300
  rewarmup_from_step: 30517
  rewarmup_steps: 500
  decay_start_step: 82396
  learning_rate: 6.0e-4
  lr_floor: 0.1
  batch_sequences: 8
  grad_accumulation_steps: 1
