model:
  name: "meta-llama/Llama-3.2-1b"
  student:
    reduce_size: true  # Whether to reduce student model size
    size_reduction_factor: 2  # >1 creates a smaller student than the teacher

data:
  sources:
    - path: "data/apollo/merged_apollo_en_corpus.jsonl"
  max_length: 512
  stride: 128  # Overlap between neighboring chunks
  val_stride: 0  # Tokenizer stride is overlap; 0 gives non-overlapping validation windows
  val_split_ratio: 0.1
  batch_size: 8

tokenizer:
  train_padding_side: "right"
  generation_padding_side: "left"

training:
  learning_rate: 1.0e-4
  epochs: 3
  max_steps_per_epoch: null
  gradient_accumulation_steps: 4
  clip_grad_norm: 1.0
  warmup_steps: 2000
  kd_ratio: 0.5  # Mixed KD + NTP objective; use 0.0 for NTP-only and 1.0 only as a diagnostic
  primary_val_metric: "ntp_loss"  # Best checkpoint selection metric
  ntp_only: false
  seed: 42
  log_every_n_steps: 100
  eval_every: 1000
  eval_steps: 100

  kd_loss_type: "kl_div"  # Options: "mse" or "kl_div"
  kd_temperature: 2.0  # Temperature for KL Divergence

checkpointing:
  save_every_n_epochs: 1
  keep_n_checkpoints: 5
  resume: null

output:
  dir: "runs/kd_LLM_modular_v1"

generation:
  every_n_steps: 500
  sample_num_examples: 2
  max_new_tokens: 50
  do_sample: false
  temperature: 0.7
  top_p: 0.9

wandb:
  enabled: true
  project: "llm_kd"
  name: "distributed_training"
  resume_id: null
  tags: []
  notes: ""
  log_every_n_steps: 10
